name: Check public Bundler (read-only, manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bundler endpoint configuration
        env:
          BUNDLER_RPC_URL: ${{ secrets.BUNDLER_RPC_URL }}
        run: |
          if [ -z "$BUNDLER_RPC_URL" ]; then
            echo "BUNDLER_RPC_URL is not configured. No public bundler has been tested."
            exit 1
          fi
          node scripts/check-bundler.js
        # A public bundler may advertise EntryPoint v0.7 but still reject
        # GASO Paymaster UserOperations; this is only a read-only first check.
